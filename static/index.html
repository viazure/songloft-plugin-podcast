<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>播客</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; max-width: 780px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    h2 { font-size: 1rem; margin: 0; font-weight: 650; }
    .muted { opacity: .7; font-size: .9rem; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; padding: 14px; margin: 12px 0; }
    label { display: block; font-size: .85rem; margin: 10px 0 4px; }
    input[type=text], input[type=url], input[type=number], select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: CanvasText;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    button { padding: 8px 12px; border-radius: 8px; border: 0; cursor: pointer; background: #6b3fa0; color: #fff; }
    button.secondary { background: color-mix(in srgb, CanvasText 14%, Canvas); color: CanvasText; }
    button.danger { background: #b00020; color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #flash { margin: 8px 0 0; font-size: .9rem; min-height: 1.2em; }
    .ok { color: #0a7a32; } .warn { color: #a15c00; } .err { color: #b00020; }
    .sub-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .sub-row {
      border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 10px; padding: 12px; background: color-mix(in srgb, CanvasText 4%, Canvas);
    }
    .sub-row h3 { margin: 0 0 4px; font-size: 1rem; }
    .sub-meta { font-size: .82rem; opacity: .75; line-height: 1.45; }
    .sub-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .check { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; }
    .check label { margin: 0; }
    .ep-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
    .ep-row {
      font-size: .88rem; padding: 8px 10px; border-radius: 8px;
      border: 1px solid color-mix(in srgb, CanvasText 10%, transparent);
    }
    .ep-row .meta { font-size: .78rem; opacity: .7; }
    .empty { opacity: .65; font-size: .9rem; padding: 8px 0; }
    pre.log { white-space: pre-wrap; word-break: break-word; font-size: .78rem; max-height: 220px; overflow: auto; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h1>播客</h1>
  <p class="muted">订阅公开 RSS → 剧集入库为远程曲 → 覆盖同步到「每订阅一张」歌单。在 Songloft 打开对应歌单即可播放（不直连音箱）。</p>
  <div id="flash" class="muted"></div>

  <div class="card">
    <h2>添加订阅</h2>
    <label for="feedUrl">RSS URL</label>
    <input id="feedUrl" type="url" placeholder="https://example.com/podcast.xml" />
    <div class="row">
      <button type="button" id="btnAdd">添加并拉取</button>
      <button type="button" class="secondary" id="btnRefreshAll">刷新全部</button>
      <button type="button" class="secondary" id="btnReload">刷新状态</button>
    </div>
  </div>

  <div class="card">
    <h2>订阅列表</h2>
    <div id="subList" class="sub-list"><div class="empty">加载中…</div></div>
  </div>

  <div class="card" id="episodesCard" hidden>
    <h2 id="episodesTitle">剧集</h2>
    <p id="episodesTip" class="muted"></p>
    <div id="epList" class="ep-list"></div>
  </div>

  <div class="card">
    <h2>定时刷新</h2>
    <p class="muted">默认关闭。开启后按间隔重拉全部订阅（插件内定时器，不挂音箱 cron）。</p>
    <div class="check">
      <input id="scheduleEnabled" type="checkbox" />
      <label for="scheduleEnabled">启用定时刷新</label>
    </div>
    <label for="scheduleInterval">间隔（小时）</label>
    <select id="scheduleInterval">
      <option value="6" selected>6</option>
      <option value="12">12</option>
      <option value="24">24</option>
    </select>
    <label for="maxEpisodes">每订阅最近剧集数</label>
    <input id="maxEpisodes" type="number" min="1" max="200" value="50" />
    <div id="scheduleMeta" class="muted" style="margin-top:8px">下次：—</div>
    <div class="row">
      <button type="button" id="btnSaveSchedule">保存定时 / 设置</button>
    </div>
  </div>

  <div class="card">
    <h2>最近日志</h2>
    <pre id="logBox" class="log muted">（空）</pre>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
